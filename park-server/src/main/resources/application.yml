# ==================== 公共配置 ====================
# 敏感信息请在 application-dev.yml 或 application-prod.yml 中配置

# 服务端口
server:
  port: 8080

# Spring 配置
spring:
  application:
    name: park-server
  # 默认使用开发环境
  profiles:
    active: dev
  # Jackson 配置（公共）
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis-Plus 配置（公共）
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.park.common.entity,com.park.auth.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
