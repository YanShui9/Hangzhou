# ==================== 开发环境配置 ====================

# 数据源配置（开发环境）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/park_evaluation?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

# JWT 配置（开发环境）
jwt:
  secret: FYU+1V2eovhMArOLYhs02dolXLqU8GerdB4Db3Gyiio=
  expiration: 86400000  # 24小时
  token-prefix: "Bearer "
  header: Authorization

# Swagger 配置（开发环境开启）
swagger:
  enabled: true
  title: 智慧公园管理平台 API（开发环境）
  description: 智慧公园管理平台后端接口文档
  version: 1.0.0

# 日志配置（开发环境 - 详细日志）
logging:
  level:
    com.park: debug
    org.springframework: info
    org.springframework.web: debug
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
